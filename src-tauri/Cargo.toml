[package]
name = "Keira4"
version = "0.0.1"
description = "Keira4 is a modern editor for AzerothCore and TrinityCore servers, making it easier to create, edit, and manage World of Warcraft private servers."
authors = ["you"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
keyring = "4.0.0"
log = "0.4.29"
mysql = { version = "28.0.0", features = ["rustls-tls-ring"] }
russh = "0.60.2"
russh-keys = "0.49.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-store = "2.4.3"
thiserror = "2.0.18"
toml = "1.1.2+spec-1.1.0"
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-positioner = "2.3.1"
tauri-plugin-updater = "2.10.1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true   # enable incremental compilation for faster dev builds

[profile.release]
opt-level = "z"      # optimize for binary size
lto = true           # enable full Link-Time Optimization
codegen-units = 1    # better optimization, smaller binary
incremental = false  # disable incremental compilation for release
debug = 0            # disable debug information generation
panic = "abort"      # remove panic unwinding support
strip = true         # strip debug symbols from binary

[profile.release.package."*"]
opt-level = "z"      # optimize dependencies for smaller size
strip = "symbols"    # strip symbols from dependency binaries
debug = 0            # disable debug info for dependencies
